- name: Ensure LaunchAgents directory exists
  ansible.builtin.file:
    path: ~/Library/LaunchAgents
    state: directory
    mode: '0755'
  tags:
    - sketchybar

- name: Copy sketchybar plist file
  ansible.builtin.copy:
    src: ./macos/felixkratz.formulae.sketchybar.plist
    dest: ~/Library/LaunchAgents/felixkratz.formulae.sketchybar.plist
    mode: '0644'
  tags:
    - sketchybar

- name: Bootstrap sketchybar launchd service
  shell: launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/felixkratz.formulae.sketchybar.plist
  ignore_errors: true
  tags:
    - sketchybar

- name: Enable sketchybar service to start at login
  shell: launchctl enable gui/$(id -u)/felixkratz.formulae.sketchybar
  ignore_errors: true
  tags:
    - sketchybar
