- name: Get yabai executable path
  shell: which yabai
  register: yabai_path
  changed_when: false
  tags:
    - yabai
    - scripting-addition

- name: Configure sudoers for yabai scripting addition
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/yabai
    line: "{{ ansible_user_id }} ALL=(root) NOPASSWD: {{ yabai_path.stdout }} --load-sa"
    create: yes
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'
  become: true
  tags:
    - yabai
    - scripting-addition
- name: Check if yabai
  stat:
    path: /opt/homebrew/bin/yabai
  register: yabai_exists

- name: Install yabai from HEAD
  shell: brew install koekeishiya/formulae/yabai --HEAD
  when:
    - not yabai_exists.stat.exists

- name: Install yabai service
  shell: yabai --install-service
  ignore_errors: true
  tags:
    - yabai

- name: Bootstrap yabai launchd service
  shell: launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/com.koekeishiya.yabai.plist
  ignore_errors: true
  tags:
    - yabai

- name: Enable yabai service to start at login
  shell: launchctl enable gui/$(id -u)/com.koekeishiya.yabai
  ignore_errors: true
  tags:
    - yabai
