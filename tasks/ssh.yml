- name: Ensure .ssh directory exists.
  file:
    dest: "{{ dest_key | dirname }}"
    mode: 0700
    state: directory
  tags:
    - dotfiles
    - install
    - ssh
- name: Install ssh key
  copy:
    src: "{{ source_key }}"
    dest: "{{ dest_key }}"
    mode: 0600
  become: no
  tags:
    - dotfiles
    - install
    - ssh
- name: Install ssh key public
  copy:
    src: "{{ source_key }}.pub"
    dest: "{{ dest_key }}.pub"
    mode: 0644
  tags:
    - dotfiles
    - install
    - ssh
- name: Set authorized key taken from file
  authorized_key:
    user: "{{ lookup('env', 'USER') }}"
    state: present
    key: "{{ lookup('file', item) }}"
  with_fileglob:
    - "{{ lookup('env', 'HOME') }}/.ssh/*.pub"

- name: Check if SSH key is already loaded in agent
  shell: ssh-add -l | grep -q "$(ssh-keygen -lf {{ dest_key }}.pub | awk '{print $2}')"
  register: key_loaded
  failed_when: false
  changed_when: false
  tags:
    - ssh

- name: Add SSH Key to agent
  shell: ssh-add {{ dest_key }}
  when: key_loaded.rc != 0
  ignore_errors: yes
  tags:
    - ssh

- name: Add GitHub to known hosts
  known_hosts:
    name: github.com
    key: "{{ lookup('pipe', 'ssh-keyscan -t rsa github.com') }}"
    state: present
  tags:
    - ssh
