- name: Remap caps lock to left control
  shell: hidutil property --set '{"UserKeyMapping":[{"HIDKeyboardModifierMappingSrc":0x700000039,"HIDKeyboardModifierMappingDst":0x7000000E0}]}'
  tags:
    - keyboard
    - macos
    - osx_defaults

- name: Unload existing LaunchAgent if present
  ansible.builtin.command: launchctl unload ~/Library/LaunchAgents/local.hidutilKeyMapping.plist
  ignore_errors: true
  tags:
    - keyboard
    - macos
    - osx_defaults

- name: Check if caps lock hidutil daemon exists
  stat:
    path: /Library/LaunchDaemons/local.hidutilKeyMapping.plist
  register: daemon_exists
  become: true
  tags:
    - keyboard
    - macos
    - osx_defaults

- name: Copy caps lock hidutil plist to LaunchDaemons
  ansible.builtin.copy:
    src: ./macos/local.hidutilKeyMapping.plist
    dest: /Library/LaunchDaemons/local.hidutilKeyMapping.plist
    owner: root
    group: wheel
    mode: "0644"
  become: true
  when:
    - not daemon_exists.stat.exists
  tags:
    - keyboard
    - macos
    - osx_defaults

- name: Load caps lock hidutil daemon
  ansible.builtin.command: launchctl load /Library/LaunchDaemons/local.hidutilKeyMapping.plist
  become: true
  when:
    - not daemon_exists.stat.exists
  tags:
    - keyboard
    - macos
    - osx_defaults
